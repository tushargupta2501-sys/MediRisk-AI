# Render Blueprint — MediRisk AI
# Deploys two services from one repo: FastAPI backend + Streamlit frontend
# https://render.com/docs/blueprint-spec

services:
  # ── FastAPI Backend ──────────────────────────────────────────
  - type: web
    name: medirisk-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
    healthCheckPath: /

  # ── Streamlit Frontend ───────────────────────────────────────
  - type: web
    name: medirisk-ui
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MEDIRISK_API_URL
        fromService:
          name: medirisk-api
          type: web
          property: host
          # Render injects the full https://… URL of medirisk-api here
